name: first ci

on:
  push: 
    branches: [main]
  pull_request: 
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      
      - name: dependencies
        run: npm install
      
      - name: tests
        run: npm run test
