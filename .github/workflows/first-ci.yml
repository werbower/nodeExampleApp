name: first ci

on:
  push: 
    branches: [main]
  pull_request: 
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@4

      - name: setup node.js
        uses: actions/setup-node@4
        with:
          node-version: 22
      
      - name: dependencies
        run: npm install
      
      - name: tests
        run: npm run tests
